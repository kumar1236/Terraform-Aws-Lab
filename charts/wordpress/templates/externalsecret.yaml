{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "wordpress.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wordpress.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ include "wordpress.storeName" . }}
    kind: SecretStore
  target:
    name: {{ include "wordpress.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: root-password
      remoteRef:
        key: {{ .Values.externalSecrets.secretName | quote }}
        property: root-password
    - secretKey: wordpress-password
      remoteRef:
        key: {{ .Values.externalSecrets.secretName | quote }}
        property: wordpress-password
{{- end }}
