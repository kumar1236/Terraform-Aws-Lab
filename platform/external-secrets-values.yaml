# ESO is installed separately so its CRDs/webhook exist before the app's CRs.
installCRDs: true
serviceAccount:
  create: true
  name: external-secrets
  automount: true
scopedNamespace: wordpress
scopedRBAC: true
processClusterStore: false
processClusterExternalSecret: false
processClusterPushSecret: false
processClusterGenerator: false
processPushSecret: false
rbac:
  serviceAccountTokenCreate: false
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
